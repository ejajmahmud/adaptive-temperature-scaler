[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-temperature-scaler"
version = "0.1.0"
description = "Entropy-driven temperature controller scaling sampling parameters dynamically down during syntax-critical blocks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
adaptive-temperature-scaler = "adaptive_temperature_scaler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adaptive_temperature_scaler*"]
